cat > templates/login.html << 'ENDOFFILE'
{% extends "base.html" %}
{% block content %}
<div style="max-width:480px;margin:48px auto;">
  <div class="card">
    <h1 style="font-size:24px;margin-bottom:24px;">Вход в аккаунт</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      <div class="form-group">
        <label>Имя пользователя</label>
        {{ form.username(class="form-control") }}
      </div>
      <div class="form-group">
        <label>Пароль</label>
        {{ form.password(class="form-control") }}
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Войти</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:14px;color:#6b7280;">
      Нет аккаунта? <a href="{{ url_for('register') }}" style="color:#6366f1;">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
ENDOFFILE

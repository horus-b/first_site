<div class="wallpaper" aria-hidden="true">
  <img
    class="wallpaper-image"
    src="{{ url_for('static', filename='images/sakura.jpg') }}"
    alt=""
  >

  <video
    id="wallpaper-video"
    class="wallpaper-video"
    muted
    loop
    playsinline
    preload="none"
    poster="{{ url_for('static', filename='images/sakura.jpg') }}"
    aria-hidden="true"
  ></video>

  <div class="wallpaper-shade"></div>
</div>

<canvas id="snow-canvas" aria-hidden="true"></canvas>
